# =============================================================================
# payment-service — odeme islemleri, Redis ile idempotency
# Ortam degiskenleri ConfigMap (supply-chain-config) ve Secret
# (supply-chain-secret) uzerinden gelir; imaj icindeki application.yml
# degerlerini SPRING_* env degiskenleri ezer.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: supply-chain
  labels:
    app: payment-service
    app.kubernetes.io/part-of: supply-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: supply-chain-payment-service:latest
          # Imaj yerelde 'docker build' ile uretilip 'kind load docker-image'
          # ile cluster'a aktarildigi icin registry'den cekilmemeli.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http

          # --- Ortam degiskenleri ---
          # Kafka/Redis/Zipkin adresleri ve probe ayarlari toplu halde gelir.
          envFrom:
            - configMapRef:
                name: supply-chain-config
          env:
            # POSTGRES_HOST/PORT envFrom ile de geliyor; ancak k8s'in
            # $(VAR) yerine koyma ozelligi YALNIZCA ayni env listesinde
            # daha once tanimlanmis degiskenleri gorur — envFrom'dan
            # gelenleri gormez. Bu yuzden URL'de kullanabilmek icin
            # burada acikca tekrar tanimlaniyorlar.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: supply-chain-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: supply-chain-config
                  key: POSTGRES_PORT
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/payments_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: supply-chain-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supply-chain-secret
                  key: POSTGRES_PASSWORD

          # --- Saglik kontrolleri (/actuator/health) ---
          # startupProbe: yavas acilan JVM'e sure tanir. Bu prob basarili
          # olana kadar liveness/readiness calistirilmaz — boylece acilis
          # sirasinda pod bosuna oldurulmez (max 60 x 5sn = 5 dk).
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
            failureThreshold: 60

          # readinessProbe: pod trafige hazir mi? Basarisizsa Service
          # endpoint listesinden cikarilir ama pod OLDURULMEZ.
          # /readiness, DB/Kafka gibi bagimliliklarin durumunu yansitir.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # livenessProbe: uygulama tamamen kilitlendi mi? Basarisizsa
          # kubelet konteyneri YENIDEN BASLATIR.
          # Bilerek /liveness kullanilir: duz /actuator/health bagimlilik
          # durumunu da icerdiginden, Redis/Kafka gecici olarak duserse
          # saglikli pod'lar restart dongusune girerdi.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: supply-chain
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http
