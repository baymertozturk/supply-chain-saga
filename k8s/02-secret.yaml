# =============================================================================
# Secret — veritabani kimlik bilgileri.
# NOT: Bu dosya demo amaclidir ve degerler repo'ya islenmistir. Gercek bir
# ortamda Secret'lar repoya konmaz; Sealed Secrets / External Secrets /
# bulut saglayici secret yoneticisi kullanilir.
# stringData: base64 kodlamasi gerektirmez, k8s kendisi kodlar.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: supply-chain-secret
  namespace: supply-chain
  labels:
    app.kubernetes.io/part-of: supply-chain
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "admin123"
