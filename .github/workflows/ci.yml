name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # Job 1: Unit & Integration Tests + Code Coverage
  # =========================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test -B

      # Test patlarsa surefire raporlarini GitHub "annotation" olarak yaz.
      # Boylece hata detayi, log dosyasini indirmeden Actions ozetinde gorunur.
      - name: Surface Test Failures as Annotations
        if: failure()
        run: |
          shopt -s nullglob
          for f in */target/surefire-reports/*.txt; do
            if grep -qE "FAILURE!|ERROR!" "$f"; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
              # Ilk 20 satiri tek satirlik annotation'a sikistir
              detail=$(head -20 "$f" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/ /g')
              echo "::error file=$f::$detail"
            fi
          done

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/**'
          retention-days: 7

  # =========================================================================
  # Job 2: Multi-Stage Docker Image Build (All 4 Microservices)
  # =========================================================================
  build-docker:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: supply-chain-${{ matrix.service }}:latest
