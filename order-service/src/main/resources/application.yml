server:
  port: 8081

spring:
  application:
    name: order-service

  # --- PostgreSQL ---
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Kafka ---
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

  # --- Redis ---
  data:
    redis:
      host: localhost
      port: 6379

# --- Observability & Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # Test ortamında %100 trace yakalama
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
