# =============================================================================
# Frontend'i sunar VE API isteklerini mikroservislere yonlendirir.
#
# Neden reverse proxy? Tarayici acisindan her sey tek origin'de
# (http://localhost:3001) toplandigi icin CORS devreye girmez — bu sayede
# Java servislerine tek satir CORS yapilandirmasi eklemeye gerek kalmaz.
#
# Servis adlari (order-service, inventory-service, ...) hem docker-compose
# agi hem de Kubernetes Service DNS'i tarafindan ayni sekilde cozulur.
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statik varliklar uzun sureli onbellege alinir (dosya adlari hash'li)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: bilinmeyen yollar index.html'e duser
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API: siparisler ----
    location /api/orders {
        rewrite ^/api/orders(.*)$ /orders$1 break;
        proxy_pass http://order-service:8081;
        proxy_set_header Host $host;
    }

    # ---- API: urunler / stok ----
    location /api/products {
        rewrite ^/api/products(.*)$ /products$1 break;
        proxy_pass http://inventory-service:8082;
        proxy_set_header Host $host;
    }

    # ---- Saglik uclari (diyagramdaki isiklar) ----
    # proxy_intercept_errors kapali: Spring bagimlilik DOWN oldugunda 503 +
    # JSON govde doner; arayuz o govdeyi okuyabilmeli.
    location = /api/health/order {
        proxy_pass http://order-service:8081/actuator/health;
    }
    location = /api/health/inventory {
        proxy_pass http://inventory-service:8082/actuator/health;
    }
    location = /api/health/payment {
        proxy_pass http://payment-service:8083/actuator/health;
    }
    location = /api/health/notify {
        proxy_pass http://notification-service:8084/actuator/health;
    }
}
